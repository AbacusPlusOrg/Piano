<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#14110e">
  <meta name="description" content="A+Piano MIDI Input Test: note detection and visual feedback.">
  <title>A+Piano — MIDI Input Test</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314110e'/%3E%3Crect x='3' y='3' width='2.2' height='10' rx='0.4' fill='%23f4eee4'/%3E%3Crect x='6.4' y='3' width='2.2' height='10' rx='0.4' fill='%23f4eee4'/%3E%3Crect x='9.8' y='3' width='2.2' height='10' rx='0.4' fill='%23f4eee4'/%3E%3Crect x='4.6' y='3' width='1.5' height='6' rx='0.3' fill='%23e0a15a'/%3E%3Crect x='8' y='3' width='1.5' height='6' rx='0.3' fill='%23e0a15a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=1795804786">
</head>
<body>
  <div class="top">
    <h1>A+Piano <span>— MIDI Input Test</span></h1>
    <div class="top-tools">
      <div class="sound-controls" id="sound-controls">
        <button type="button" id="btn-sound" class="sound-toggle" aria-pressed="false" aria-label="Sound off.">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M3.5 9.5v5h3.2l4.3 3.6V5.9L6.7 9.5H3.5z"/>
            <path class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M15.6 9a4.2 4.2 0 0 1 0 6M18.6 6.8a7.2 7.2 0 0 1 0 10.4"/>
            <path class="sound-slash" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M5 5.5 19 18.5"/>
          </svg>
        </button>
        <input type="range" id="sound-volume" class="sound-volume" min="0" max="100" value="70" step="1" aria-label="Volume.">
      </div>
      <div id="mode-switch" class="mode-switch" role="tablist" aria-label="Keyboard or Play">
        <button type="button" role="tab" id="mode-keyboard" aria-selected="true">Test</button>
        <button type="button" role="tab" id="mode-play" aria-selected="false" tabindex="-1">Play</button>
      </div>
    </div>
  </div>

  <div class="status-wrap">
    <div id="status" class="status is-warn" role="status">
      <span class="dot" aria-hidden="true"></span>
      <div class="msg">Checking for MIDI<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
  </div>

  <div class="kb-wrap">
    <div class="kb-bar">
      <span id="range-label">C3–C5 · 25 keys</span>
      <span class="kb-tap-hint">Tap keys to test.</span>
      <button type="button" id="btn-reset-range" disabled>Reset range</button>
    </div>
    <div class="highway-slot">
      <canvas id="highway" class="highway" aria-label="Falling notes."></canvas>
    </div>
    <div id="kb-scroll" class="kb-scroll">
      <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
    </div>
    <button type="button" id="play-pause" class="play-pause" hidden aria-label="Pause.">Pause</button>
    <div id="key-height" class="key-height" role="slider" tabindex="0" aria-label="Key height" aria-orientation="vertical"></div>
    <div id="play-sheet" class="play-sheet" role="dialog" aria-modal="true" aria-labelledby="play-sheet-title" hidden>
      <div class="play-sheet-card">
        <div class="play-sheet-head">
          <h2 id="play-sheet-title" class="play-sheet-title">A+Piano</h2>
          <div class="play-sheet-tools" id="play-sheet-tools">
            <button type="button" id="play-to-test" class="play-to-test" aria-label="Switch to Test.">Test</button>
          </div>
        </div>
        <div class="play-midi" id="play-midi">
          <p class="play-midi-msg" id="play-midi-msg" role="status"></p>
          <button type="button" id="play-midi-connect" hidden aria-label="Connect MIDI keyboard.">Connect</button>
        </div>
        <select id="play-song" aria-label="Song."></select>
        <select id="play-rung" aria-label="Part to play."></select>
        <label class="toggle"><input type="checkbox" id="play-wait" checked> Wait for me!</label>
        <div class="play-tempo-row">
          <label for="play-tempo" class="play-tempo-label">Tempo</label>
          <input type="range" id="play-tempo" min="50" max="150" step="5" value="100">
          <output id="play-tempo-out" for="play-tempo">100%</output>
        </div>
        <fieldset class="play-keys" id="play-keys">
          <legend>Keys</legend>
          <label title="The song's keys, padded to at least an octave."><input type="radio" name="play-keys" value="octave"> Octave</label>
          <label title="Only the white keys the part uses."><input type="radio" name="play-keys" value="tight"> Tight</label>
          <label title="One more white key on each side."><input type="radio" name="play-keys" value="plus"> Plus one</label>
          <label title="Whole C–E and F–B groups."><input type="radio" name="play-keys" value="groups"> Groups</label>
        </fieldset>
        <div class="play-actions">
          <button type="button" id="play-toggle">Start</button>
          <button type="button" id="play-restart">Restart</button>
        </div>
      </div>
    </div>
  </div>

  <div class="lower">
    <div id="pane-switch" class="pane-switch" role="tablist" aria-label="Stats, Log, and Help">
      <button type="button" role="tab" id="tab-stats" aria-controls="panel-stats" aria-selected="true" tabindex="0">Stats</button>
      <button type="button" role="tab" id="tab-log" aria-controls="panel-log" aria-selected="false" tabindex="-1">Log</button>
      <button type="button" role="tab" id="tab-help" aria-controls="panel-help" aria-selected="false" tabindex="-1">Help</button>
    </div>
    <div id="pane-stage" class="pane-stage">
      <div id="panel-stats" class="pane pane-stats" role="tabpanel" aria-labelledby="tab-stats">
        <div class="readout">
          <div class="card now-card">
            <div class="label head"><span>Last note</span><span class="ch">ch <span id="last-ch">—</span></span></div>
            <div class="now-grid">
              <div id="last-name" class="last-name">—</div>
              <div class="now-meta">
                <div class="pair"><div><div class="k">MIDI</div><div id="last-num" class="v">—</div></div>
                  <div><div class="k">Velocity</div><div class="v"><span id="last-vel">—</span></div></div></div>
                <div class="pair"><div><div class="k">Held</div><div id="held-count" class="v">0</div></div>
                  <div><div class="k">Sustain</div><div><span id="sustain" class="sustain">off</span></div></div></div>
              </div>
            </div>
          </div>
          <div class="card session-card">
            <div class="label">Session</div>
            <div class="stats">
              <div><div class="k">Highest</div><div id="seen-high" class="v">—</div></div>
              <div><div class="k">Lowest</div><div id="seen-low" class="v">—</div></div>
            </div>
          </div>
          <div id="latency" class="latency">On-screen delay: — <em>(estimate of visual lag, not audio)</em></div>
        </div>
      </div>
      <div id="panel-log" class="pane pane-log" role="tabpanel" aria-labelledby="tab-log" hidden>
        <div class="log-wrap">
          <div class="log-bar">
            <label class="toggle"><input type="checkbox" id="filter-rt" checked> Hide clock &amp; active sensing</label>
            <span class="spacer"></span>
            <button type="button" id="btn-clear">Clear log</button>
          </div>
          <div id="log" class="log"><div class="empty">No messages yet.</div></div>
        </div>
      </div>
      <div id="panel-help" class="pane pane-help" role="tabpanel" aria-labelledby="tab-help" hidden>
        <div id="debug-panel" class="debug-panel">
          <p id="debug-summary" class="debug-summary"></p>
          <div class="debug-actions">
            <button type="button" id="btn-debug-scan">Scan now</button>
            <button type="button" id="btn-debug-copy">Copy report</button>
          </div>
          <div id="debug-body" class="debug-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=1795804786" defer></script>
</body>
</html>
